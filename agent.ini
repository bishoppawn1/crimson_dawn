[delivery]
# Push once each requested repository change is complete and validated.
push_after_each_completed_change = true
remote = origin
branch = main

[validation]
commands = npm test; npm run check; git diff --check
require_success = true

[git]
# Commit only files that belong to the completed request. Preserve unrelated work.
stage_scope = task_only
require_commit = true
push_command = git push origin main
allow_force_push = false
allow_destructive_history_rewrite = false

[failure]
# Never push a knowingly failing change. Report validation or push failures.
push_on_validation_failure = false
report_blocker = true
